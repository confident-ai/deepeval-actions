name: "Confident PR Eval Gate"
description: "Runs the Confident gates configured for this repository (metric evals over a pinned dataset, and/or a frozen adversarial attack suite), submits the outputs to Confident, which scores them and posts the PR check-runs. Set up your app's runtime (Python + dependencies) in earlier steps; this action runs the pinned runner against it."

inputs:
  base_url:
    description: "Confident API base URL (region-specific)."
    required: true
  dataset_alias:
    description: "Fallback only: dataset alias used when the backend has no gate-config endpoint (older/on-prem deployments). Configured gates come from Confident."
    required: false
    default: ""
  dataset_version:
    description: "Fallback only: dataset version used with dataset_alias."
    required: false
    default: "latest"
  confident_api_key:
    description: "Confident project API key (injected as the CONFIDENT_API_KEY repo secret during setup)."
    required: true

runs:
  using: "composite"
  steps:
    # No Python setup here on purpose: the caller's workflow owns the runtime +
    # dependency install so the runner imports the app against the same
    # environment. The runner itself is stdlib-only.
    - name: Run Confident PR Eval Gate
      shell: bash
      run: python "${{ github.action_path }}/runner.py"
      env:
        CONFIDENT_BASE_URL: ${{ inputs.base_url }}
        CONFIDENT_API_KEY: ${{ inputs.confident_api_key }}
        CONFIDENT_RISK_RUN_ID_FILE: ${{ runner.temp }}/confident-eval-gate/risk-run-id
        DATASET_ALIAS: ${{ inputs.dataset_alias }}
        DATASET_VERSION: ${{ inputs.dataset_version }}
        REPO: ${{ github.repository }}
        REPO_ID: ${{ github.repository_id }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
    # Advisory code scan on risk-gate regressions; needs CONFIDENT_SCAN_API_KEY in
    # the env and always exits 0.
    - name: Confident PR Code Scan
      if: ${{ !cancelled() }}
      continue-on-error: true
      shell: bash
      run: python "${{ github.action_path }}/scan.py"
      env:
        CONFIDENT_BASE_URL: ${{ inputs.base_url }}
        CONFIDENT_API_KEY: ${{ inputs.confident_api_key }}
        CONFIDENT_RISK_RUN_ID_FILE: ${{ runner.temp }}/confident-eval-gate/risk-run-id
